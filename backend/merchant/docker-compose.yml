services:
  merchant:
    image: "merchant:latest"
    container_name: merchant-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m #allow to use the max of 700mb memory
    networks:
      - posms
  terminal:
    image: "terminal:latest"
    container_name: terminal-ms
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - posms
  transaction:
    image: "transaction:latest"
    container_name: transaction-ms
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - posms
networks:
  posms:
    driver: "bridge"
