server:
  port: 8080
spring:
  application:
    name: merchants
  profiles:
    active: "qa"
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/merchant?createDatabaseIfNotExist=true
    username: ${SCHEMA_USERNAME}
    password: ${SCHEMA_PASSWORD}
  jpa:
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    stream:
      bindings:
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
        merchantCreated-out-0:
          destination: merchant-created
      kafka:
        binder:
          brokers:
            - localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

resilience4j.ratelimiter:
  configs:
    default:
      timeoutDuration: 1000
      limitRefreshPeriod: 10000
      limitForPeriod: 1
